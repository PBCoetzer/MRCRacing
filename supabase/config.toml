
[functions.hermes-race-bridge]
enabled = true
verify_jwt = false
import_map = "./functions/hermes-race-bridge/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/hermes-race-bridge/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/hermes-race-bridge/*.html" ]

[functions.sync-race-data]
enabled = true
verify_jwt = false
import_map = "./functions/sync-race-data/deno.json"
entrypoint = "./functions/sync-race-data/index.ts"
